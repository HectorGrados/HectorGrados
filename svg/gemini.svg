<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Gemini API">
  <title>Gemini API</title>
  <style>
    .logo { animation: flotar 2.6s ease-in-out infinite; animation-delay: -0.35s; }
    .sombra { transform-box: fill-box; transform-origin: center; animation: sombra 2.6s ease-in-out infinite; animation-delay: -0.35s; }
    @keyframes flotar { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes sombra { 0%, 100% { transform: scaleX(1); opacity: 0.28; } 50% { transform: scaleX(0.72); opacity: 0.14; } }
    @media (prefers-reduced-motion: reduce) { .logo, .sombra { animation: none; } }
  </style>
